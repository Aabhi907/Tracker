<!doctype html><html><head><meta charset="utf-8">
<script src="node_modules/p5/lib/p5.min.js"></script>
<script src="node_modules/p5.brush/dist/p5.brush.js"></script>
<style>html,body{margin:0;background:#111}</style></head><body><script>
function setup(){
  createCanvas(1440,1080,WEBGL);pixelDensity(1);background('#F3EEE8');
  brush.seed(7);brush.scaleBrushes(2.4);
  // maroon watercolor wash blob
  brush.noStroke();brush.fill('#7A0E26',90);brush.fillBleed(0.25);brush.circle(-330,-120,190);
  // pencil + marker strokes
  brush.noFill();brush.set('HB','#2f2a26',1.6);brush.line(-620,250,-80,170);
  brush.set('marker','#7A0E26',1.2);brush.line(-620,330,-80,290);
  brush.set('charcoal','#3a2a2e',1.3);brush.line(-620,410,-80,410);
  // hatched rectangle
  brush.set('rotring','#7A0E26',0.8);brush.hatch(10,0.7);brush.rect(280,-120,380,300,'center');brush.noHatch();
  // flow-field lines
  brush.field('seabed');brush.set('pen','#C9A227',1.2);for(let i=0;i<10;i++)brush.flowLine(60+i*45,180,320,0);brush.noField();
  window.DONE=true;
}
</script></body></html>
